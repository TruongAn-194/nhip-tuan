<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e7c6b">
<title>Kế hoạch tuần</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: một cột hẹp, thanh tuần cố định phía trên, lưới thói quen 7 ngày rồi 7 cột việc cần làm; tổng quan xem lại các tuần cũ */
:root {
  --bg: #f2f5f4;
  --surface: #ffffff;
  --fg: #13211d;
  --muted: #5b6b66;
  --line: #d8e0dc;
  --accent: #0e7c6b;
  --accent-ink: #ffffff;
  --accent-soft: #dff3ee;
  --task: #4d5fc4;
  --danger: #b4372f;
  --font-display: "Be Vietnam Pro", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1513;
    --surface: #151f1c;
    --fg: #e5eee9;
    --muted: #92a39c;
    --line: #25332e;
    --accent: #4cc9ae;
    --accent-ink: #06211b;
    --accent-soft: #17352e;
    --task: #8e9dff;
    --danger: #ef8a82;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1513;
  --surface: #151f1c;
  --fg: #e5eee9;
  --muted: #92a39c;
  --line: #25332e;
  --accent: #4cc9ae;
  --accent-ink: #06211b;
  --accent-soft: #17352e;
  --task: #8e9dff;
  --danger: #ef8a82;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.muted { color: var(--muted); }
.tn { font-variant-numeric: tabular-nums; }

.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.top h1 { font-size: 26px; font-weight: 700; letter-spacing: -0.01em; }
.top .date { color: var(--muted); font-size: 14px; }
.status { color: var(--muted); font-size: 13px; text-align: right; max-width: 360px; }

.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; padding: 10px 14px; border-bottom: 2px solid transparent; margin-bottom: -1px; color: var(--muted); font-weight: 600; }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

.weekbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.wnav { display: flex; align-items: center; gap: 6px; }
.iconbtn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; }
.iconbtn:hover { border-color: var(--accent); }
.wlabel { font-family: var(--font-display); font-weight: 600; font-size: 18px; min-width: 150px; text-align: center; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 500; background: var(--accent-soft); color: var(--fg); }
.pill.past { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.linkbtn { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 4px 6px; text-decoration: underline; text-underline-offset: 3px; }
.sums { display: flex; gap: 8px; margin-left: auto; flex-wrap: wrap; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 4px 12px; margin-bottom: 12px; }
.sec-h h2 { font-size: 17px; font-weight: 600; }
.sec-h .sub { color: var(--muted); font-size: 13px; }

.scroll { overflow-x: auto; }
.hrow { display: grid; grid-template-columns: minmax(150px, 1fr) repeat(7, 36px) 48px 70px; gap: 6px; align-items: center; min-width: 600px; padding-block: 5px; }
.hrow + .hrow { border-top: 1px solid var(--line); }
.hrow.head { font-size: 12px; color: var(--muted); font-weight: 500; text-align: center; border-top: 0; padding-bottom: 8px; }
.hrow.head .nm { text-align: left; }
.hrow .nm { font-weight: 500; overflow-wrap: anywhere; }
.dcol { display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
.dcol.today b { color: var(--accent); }
.dcol small { font-size: 11px; }
.cell { width: 32px; height: 32px; border-radius: 9px; border: 1.5px solid var(--line); background: transparent; display: grid; place-items: center; justify-self: center; padding: 0; }
.cell:hover { border-color: var(--accent); }
.cell[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.cell svg { width: 16px; height: 16px; display: none; }
.cell[aria-pressed="true"] svg { display: block; }
.pct { text-align: center; font-weight: 600; font-size: 14px; }
.stk { text-align: center; font-size: 13px; color: var(--muted); }
.stk b { color: var(--fg); font-size: 15px; font-family: var(--font-display); }

.days { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.day { border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; background: var(--surface); }
.day.today { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.dh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.dh b { font-family: var(--font-display); font-weight: 600; font-size: 14px; }
.dh span { color: var(--muted); font-size: 12px; }
.bar { height: 6px; border-radius: 99px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--task); border-radius: 99px; }
.prog { font-size: 12px; color: var(--muted); margin-top: -6px; }
.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; min-height: 28px; }
.task { display: flex; align-items: flex-start; gap: 8px; }
.tk { flex: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 1.5px solid var(--line); background: transparent; display: grid; place-items: center; padding: 0; }
.tk:hover { border-color: var(--task); }
.tk[aria-pressed="true"] { background: var(--task); border-color: var(--task); color: var(--surface); }
.tk svg { width: 12px; height: 12px; display: none; }
.tk[aria-pressed="true"] svg { display: block; }
.tt { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.task.done .tt { color: var(--muted); text-decoration: line-through; }
.xbtn { flex: none; background: none; border: 0; color: var(--muted); width: 24px; height: 24px; border-radius: 6px; padding: 0; line-height: 1; font-size: 16px; }
.xbtn:hover { color: var(--danger); }
.empty { color: var(--muted); font-size: 13px; }
.addf { display: flex; gap: 6px; margin-top: auto; }
.addf input, .mrow input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: var(--bg); font-size: 14px; }
.addf input::placeholder, .mrow input::placeholder { color: var(--muted); }
.addf button, .btn { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 7px 12px; font-weight: 600; font-size: 14px; }
.addf button:hover, .btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--danger); }

details.manage summary { cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.mlist { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
.mrow { display: flex; gap: 8px; align-items: center; }

.chart { width: 100%; height: auto; display: block; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .b-h { fill: var(--accent); }
.chart .b-t { fill: var(--task); }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--muted); margin-bottom: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }

.wlist { display: flex; flex-direction: column; }
.wrow { display: grid; grid-template-columns: minmax(120px, 1.2fr) 1fr 1fr; gap: 8px 16px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 4px; }
.wrow:first-child { border-top: 0; }
.wrow:hover { background: var(--accent-soft); }
.wrow b { font-family: var(--font-display); font-weight: 600; }
.mini small { display: block; font-size: 12px; color: var(--muted); margin-bottom: 3px; }
.mini .bar i.h { background: var(--accent); }
.srows .hrow { grid-template-columns: minmax(150px, 1fr) 90px 90px 90px; min-width: 480px; }
.srows .hrow.head { text-align: right; }
.srows .hrow .v { text-align: right; font-variant-numeric: tabular-nums; }

.auth { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; border-color: var(--accent); }
.auth b { font-family: var(--font-display); }
.authline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13px; }
.foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.foot .hint { color: var(--muted); font-size: 13px; flex-basis: 100%; }

@media (max-width: 560px) {
  .wlabel { min-width: 0; font-size: 16px; }
  .sums { margin-left: 0; }
  .wrow { grid-template-columns: 1fr 1fr; }
  .wrow > b { grid-column: 1 / -1; }
  .status { text-align: left; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width .25s ease; }
}
</style>
</head>
<body>


<div class="wrap" id="app"></div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script>
(function () {
  "use strict";
  var DAYS_SHORT = ["T2", "T3", "T4", "T5", "T6", "T7", "CN"];
  var DAYS_LONG = ["Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy", "Chủ Nhật"];
  var DEFAULT_HABITS = [
    { id: "h_day_som", name: "Dậy sớm đúng 06h00" },
    { id: "h_gym", name: "Tập gym/Thể thao" },
    { id: "h_anh", name: "Học Tiếng Anh" },
    { id: "h_sach", name: "Đọc sách" },
    { id: "h_giaotiep", name: "Luyện giao tiếp" },
    { id: "h_cashflow", name: "Cashflow" }
  ];
  var LS_KEY = "nhip-tuan-v1";
  /* Dán cấu hình Firebase vào đây (thay cho null). Để null thì trang chỉ lưu trong trình duyệt. */
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyDrezzF7kKKM1L0gwNk3_fYzxXrL5vCUSc",
    authDomain: "plan-e00c1.firebaseapp.com",
    projectId: "plan-e00c1",
    storageBucket: "plan-e00c1.firebasestorage.app",
    messagingSenderId: "354331364714",
    appId: "1:354331364714:web:f45ca63368fb5312f36913"
  };
  var authUser = null, authReady = false, unsubCloud = null;
  var CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>';
  var LEFT = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>';
  var RIGHT = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>';

  /* ---------- ngày tháng ---------- */
  function pad(n) { return String(n).padStart(2, "0"); }
  function key(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parse(k) { var p = k.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(k, n) { var d = parse(k); d.setDate(d.getDate() + n); return key(d); }
  function mondayOf(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return key(x); }
  function fmt(k) { var d = parse(k); return pad(d.getDate()) + "/" + pad(d.getMonth() + 1); }
  function todayKey() { return key(new Date()); }
  function dayIndex(k) { return (parse(k).getDay() + 6) % 7; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function uid() { return Math.random().toString(36).slice(2, 9); }

  /* ---------- dữ liệu ---------- */
  var S = { habits: null, weeks: {} };
  var view = "week";
  var cur = mondayOf(new Date());
  var manageOpen = false;
  var confirmDel = null;
  var focusId = null;
  var statusText = "Đang kết nối nơi lưu dữ liệu…";
  var app = document.getElementById("app");

  function habits() { return S.habits || DEFAULT_HABITS; }
  function emptyWeek() { return { tasks: [[], [], [], [], [], [], []], habits: {} }; }
  function getW(wk) { if (!S.weeks[wk]) S.weeks[wk] = emptyWeek(); return S.weeks[wk]; }
  function normalizeWeek(d) {
    var w = emptyWeek();
    for (var i = 0; i < 7; i++) {
      var a = d && d.tasks && d.tasks["d" + i];
      w.tasks[i] = Array.isArray(a) ? a.filter(function (t) { return t && typeof t.t === "string"; }).map(function (t) { return { id: String(t.id || uid()), t: t.t, d: !!t.d }; }) : [];
    }
    if (d && d.habits && typeof d.habits === "object") {
      Object.keys(d.habits).forEach(function (h) {
        var a = d.habits[h];
        if (Array.isArray(a)) w.habits[h] = [0, 1, 2, 3, 4, 5, 6].map(function (i) { return !!a[i]; });
      });
    }
    return w;
  }
  function weekBody(wk) {
    var W = getW(wk), tasks = {};
    for (var i = 0; i < 7; i++) tasks["d" + i] = W.tasks[i];
    return { week: wk, tasks: tasks, habits: W.habits };
  }
  function cfgBody() { return { habits: habits() }; }

  function weekStats(wk) {
    var W = S.weeks[wk], H = habits(), td = 0, tt = 0, hd = 0, i;
    if (W) {
      for (i = 0; i < 7; i++) W.tasks[i].forEach(function (t) { tt++; if (t.d) td++; });
      H.forEach(function (h) { var a = W.habits[h.id]; if (a) hd += a.filter(Boolean).length; });
    }
    return {
      td: td, tt: tt, hd: hd,
      hp: H.length ? Math.round(hd / (H.length * 7) * 100) : 0,
      tp: tt ? Math.round(td / tt * 100) : 0,
      any: tt > 0 || hd > 0
    };
  }
  function habitDone(hid, k) {
    var W = S.weeks[mondayOf(parse(k))];
    var a = W && W.habits[hid];
    return !!(a && a[dayIndex(k)]);
  }
  function streak(hid) {
    var k = todayKey();
    if (!habitDone(hid, k)) k = addDays(k, -1);
    var n = 0;
    while (habitDone(hid, k)) { n++; k = addDays(k, -1); }
    return n;
  }
  function earliestWeek() {
    var ks = Object.keys(S.weeks).filter(function (k) { return weekStats(k).any; }).sort();
    return ks[0] || null;
  }
  function bestStreak(hid) {
    var start = earliestWeek();
    if (!start) return 0;
    var k = start, end = todayKey(), run = 0, best = 0, guard = 0;
    while (k <= end && guard++ < 4000) {
      if (habitDone(hid, k)) { run++; if (run > best) best = run; } else run = 0;
      k = addDays(k, 1);
    }
    return best;
  }
  function habitRate(hid, days) {
    var k = todayKey(), n = 0, i;
    for (i = 0; i < days; i++) { if (habitDone(hid, k)) n++; k = addDays(k, -1); }
    return Math.round(n / days * 100);
  }

  /* ---------- lưu trữ ---------- */
  var store = null, pending = {}, dirty = {}, ver = {}, timers = {}, chains = {};
  function setStatus(t) {
    statusText = t;
    var el = document.getElementById("status");
    if (el) el.textContent = t;
  }
  function saveLocal() {
    try { localStorage.setItem(LS_KEY, JSON.stringify({ habits: S.habits, weeks: S.weeks })); setStatus("Đã lưu trên trình duyệt này. Nhớ sao lưu định kỳ."); }
    catch (e) { setStatus("Không lưu được trong trình duyệt này. Hãy dùng nút sao lưu."); }
  }
  function queue(docId) {
    if (!store) { pending[docId] = true; return; }
    if (store.kind === "local") { clearTimeout(timers.local); timers.local = setTimeout(saveLocal, 200); return; }
    ver[docId] = (ver[docId] || 0) + 1;
    dirty[docId] = true;
    clearTimeout(timers[docId]);
    setStatus("Đang lưu…");
    timers[docId] = setTimeout(function () { flush(docId); }, 350);
  }
  function flush(docId) {
    var v = ver[docId];
    chains[docId] = (chains[docId] || Promise.resolve()).then(function () {
      var body = docId === "config" ? cfgBody() : weekBody(docId.slice(2));
      return store.col.doc(docId).set(body);
    }).then(function () {
      if (ver[docId] === v) delete dirty[docId];
      if (!Object.keys(dirty).length) setStatus("Đã lưu cho tài khoản của bạn.");
    }).catch(function () {
      setStatus("Không lưu được. Tài khoản này có thể chỉ có quyền xem.");
    });
  }
  function applySnapshot(snap) {
    var changed = false;
    snap.docs.forEach(function (d) {
      var id = d.id;
      if (dirty[id] || !d.exists) return;
      var data = d.data();
      if (id === "config") {
        if (data && Array.isArray(data.habits) && JSON.stringify(data.habits) !== JSON.stringify(S.habits)) {
          S.habits = data.habits.filter(function (h) { return h && h.id && typeof h.name === "string"; });
          changed = true;
        }
      } else if (id.indexOf("w_") === 0) {
        var wk = id.slice(2), nw = normalizeWeek(data);
        if (JSON.stringify(nw) !== JSON.stringify(S.weeks[wk])) { S.weeks[wk] = nw; changed = true; }
      }
    });
    if (changed) render();
  }
  function loadLocal() {
    try {
      var raw = localStorage.getItem(LS_KEY);
      if (raw) {
        var o = JSON.parse(raw);
        if (o && Array.isArray(o.habits)) S.habits = o.habits;
        if (o && o.weeks) Object.keys(o.weeks).forEach(function (k) { S.weeks[k] = normalizeWeek({ tasks: tasksToObj(o.weeks[k].tasks), habits: o.weeks[k].habits }); });
      }
    } catch (e) { /* bỏ qua */ }
  }
  function useLocal() {
    loadLocal();
    store = { kind: "local" };
    setStatus("Lưu trên trình duyệt này. Nhớ sao lưu định kỳ.");
    Object.keys(pending).forEach(queue); pending = {};
    render();
  }
  function tasksToObj(arr) {
    var o = {};
    for (var i = 0; i < 7; i++) o["d" + i] = (arr && arr[i]) || [];
    return o;
  }
  function initFirebase() {
    var fb = window.firebase, auth, db;
    try {
      fb.initializeApp(FIREBASE_CONFIG);
      auth = fb.auth(); db = fb.firestore();
    } catch (e) { authReady = true; useLocal(); return; }
    loadLocal();
    window.__fbAuth = auth; window.__fbNs = fb;
    auth.onAuthStateChanged(function (u) {
      if (unsubCloud) { unsubCloud(); unsubCloud = null; }
      authReady = true;
      if (!u) {
        authUser = null;
        S = { habits: null, weeks: {} }; dirty = {}; pending = {};
        loadLocal();
        store = { kind: "local" };
        setStatus("Chưa đăng nhập. Dữ liệu chỉ lưu trên thiết bị này.");
        render();
        return;
      }
      authUser = { name: u.displayName || "", email: u.email || "" };
      store = { kind: "db", col: db.collection("users").doc(u.uid).collection("data") };
      setStatus("Đang tải dữ liệu từ đám mây…");
      var slow = setTimeout(function () { setStatus("Chưa kết nối được. Dữ liệu có thể chưa cập nhật."); }, 10000);
      var firstDone = false;
      unsubCloud = store.col.onSnapshot(function (snap) {
        if (!snap.metadata.fromCache) {
          clearTimeout(slow);
          if (!firstDone) {
            firstDone = true;
            var ids = {};
            snap.docs.forEach(function (d) { ids[d.id] = true; });
            if (!ids.config && S.habits) queue("config");
            Object.keys(S.weeks).forEach(function (wk) { if (!ids["w_" + wk] && weekStats(wk).any) queue("w_" + wk); });
          }
          if (!Object.keys(dirty).length) setStatus("Đã đồng bộ với tài khoản " + (authUser.email || "của bạn") + ".");
        }
        applySnapshot(snap);
      }, function () { clearTimeout(slow); setStatus("Không đọc được dữ liệu. Kiểm tra quy tắc bảo mật Firestore."); });
      render();
    });
  }
  function login() {
    var fb = window.__fbNs, auth = window.__fbAuth;
    if (!fb || !auth) return;
    var provider = new fb.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).catch(function (err) {
      if (err && (err.code === "auth/popup-blocked" || err.code === "auth/operation-not-supported-in-this-environment")) auth.signInWithRedirect(provider);
      else if (err && err.code === "auth/unauthorized-domain") setStatus("Địa chỉ web này chưa được thêm vào Authorized domains trong Firebase.");
      else if (!err || err.code !== "auth/popup-closed-by-user") setStatus("Đăng nhập không thành công. Thử lại sau.");
    });
  }
  function logout() { if (window.__fbAuth) window.__fbAuth.signOut(); }
  function authBar() {
    if (!FIREBASE_CONFIG || !authReady) return "";
    if (!authUser) {
      return '<section class="card auth"><div><b>Đăng nhập để lưu dữ liệu trên đám mây</b><div class="muted">Dữ liệu sẽ giữ nguyên và đồng bộ khi bạn mở trang ở điện thoại hay máy tính khác.</div></div>' +
        '<button class="btn primary" data-act="login">Đăng nhập bằng Google</button></section>';
    }
    return '<div class="authline"><span class="muted">Đã đăng nhập: ' + esc(authUser.email || authUser.name) + '</span><button class="linkbtn" data-act="logout">Đăng xuất</button></div>';
  }
  function init() {
    render();
    if (FIREBASE_CONFIG && window.firebase) { initFirebase(); return; }
    var c = window.claude;
    if (!c || !c.use) { useLocal(); return; }
    Promise.all([c.use("db"), c.use("user")]).then(function (r) {
      var db = r[0], user = r[1];
      return (user ? user.id() : Promise.resolve(null)).then(function (id) {
        if (!db || !id) { useLocal(); return; }
        store = { kind: "db", col: db.collection("data/users/" + id) };
        setStatus("Đang tải dữ liệu của bạn…");
        var slow = setTimeout(function () { setStatus("Chưa kết nối được nơi lưu. Dữ liệu có thể chưa cập nhật."); }, 10000);
        Object.keys(pending).forEach(queue); pending = {};
        store.col.onSnapshot(function (snap) {
          if (!snap.metadata.fromCache) { clearTimeout(slow); if (!Object.keys(dirty).length) setStatus("Đã lưu cho tài khoản của bạn."); }
          applySnapshot(snap);
        }, function () { clearTimeout(slow); setStatus("Không đọc được dữ liệu đã lưu."); });
      });
    }).catch(function () { useLocal(); });
  }

  /* ---------- giao diện ---------- */
  function head() {
    var d = new Date();
    return '<header class="top"><div><h1>Nhịp Tuần</h1><div class="date">' + DAYS_LONG[(d.getDay() + 6) % 7] + ", " + pad(d.getDate()) + "/" + pad(d.getMonth() + 1) + "/" + d.getFullYear() +
      '</div></div><div class="status" id="status" role="status">' + esc(statusText) + "</div></header>" + authBar() +
      '<div class="tabs" role="tablist"><button class="tab" role="tab" data-act="tab" data-v="week" aria-selected="' + (view === "week") + '">Tuần</button>' +
      '<button class="tab" role="tab" data-act="tab" data-v="over" aria-selected="' + (view === "over") + '">Tổng quan</button></div>';
  }

  function weekView() {
    var H = habits(), W = getW(cur), st = weekStats(cur), today = todayKey(), thisMon = mondayOf(new Date());
    var days = [0, 1, 2, 3, 4, 5, 6].map(function (i) { return addDays(cur, i); });
    var end = addDays(cur, 6);
    var h = '<div class="weekbar"><div class="wnav"><button class="iconbtn" data-act="prev" aria-label="Tuần trước">' + LEFT + "</button>" +
      '<div class="wlabel tn">' + fmt(cur) + " – " + fmt(end) + "/" + parse(end).getFullYear() + "</div>" +
      '<button class="iconbtn" data-act="next" aria-label="Tuần sau">' + RIGHT + "</button></div>";
    if (cur === thisMon) h += '<span class="pill">Tuần hiện tại</span>';
    else h += '<span class="pill past">' + (cur < thisMon ? "Đang xem tuần cũ" : "Tuần sắp tới") + '</span><button class="linkbtn" data-act="today">Về tuần này</button>';
    h += '<div class="sums"><span class="pill tn">Việc ' + st.td + "/" + st.tt + '</span><span class="pill tn">Thói quen ' + st.hp + "%</span></div></div>";

    /* thói quen */
    h += '<section class="card"><div class="sec-h"><h2>Thói quen mỗi ngày</h2><span class="sub">Chuỗi tính theo số ngày liên tiếp, kể cả qua các tuần</span></div>';
    if (!H.length) h += '<p class="empty">Chưa có thói quen nào. Thêm ở phần Quản lý thói quen bên dưới.</p>';
    else {
      h += '<div class="scroll"><div class="hrow head"><div class="nm">Thói quen</div>';
      days.forEach(function (k, i) { h += '<div class="dcol' + (k === today ? " today" : "") + '"><b>' + DAYS_SHORT[i] + "</b><small class=\"tn\">" + fmt(k).slice(0, 2) + "</small></div>"; });
      h += "<div>Tuần</div><div>Chuỗi</div></div>";
      H.forEach(function (hb) {
        var arr = W.habits[hb.id] || [], n = arr.filter(Boolean).length, s = streak(hb.id);
        h += '<div class="hrow"><div class="nm">' + esc(hb.name) + "</div>";
        for (var i = 0; i < 7; i++) h += '<button class="cell" data-act="hab" data-h="' + esc(hb.id) + '" data-i="' + i + '" aria-pressed="' + !!arr[i] + '" aria-label="' + esc(hb.name) + ", " + DAYS_LONG[i] + '">' + CHECK + "</button>";
        h += '<div class="pct tn">' + Math.round(n / 7 * 100) + '%</div><div class="stk tn">' + (s ? "<b>" + s + "</b> ngày" : "–") + "</div></div>";
      });
      h += "</div>";
    }
    h += "</section>";

    /* việc cần làm */
    h += '<section class="card"><div class="sec-h"><h2>Việc cần làm</h2><span class="sub">Tích vào vòng tròn khi xong việc</span></div><div class="days">';
    days.forEach(function (k, i) {
      var list = W.tasks[i], dn = list.filter(function (t) { return t.d; }).length, pc = list.length ? Math.round(dn / list.length * 100) : 0;
      h += '<div class="day' + (k === today ? " today" : "") + '"><div class="dh"><b>' + DAYS_LONG[i] + '</b><span class="tn">' + fmt(k) + "</span></div>" +
        '<div class="bar" aria-hidden="true"><i style="width:' + pc + '%"></i></div><div class="prog tn">' + dn + "/" + list.length + " việc xong</div>";
      h += '<ul class="tasks">';
      if (!list.length) h += '<li class="empty">Chưa có việc</li>';
      list.forEach(function (t) {
        h += '<li class="task' + (t.d ? " done" : "") + '"><button class="tk" data-act="tk" data-d="' + i + '" data-id="' + esc(t.id) + '" aria-pressed="' + t.d + '" aria-label="Đánh dấu hoàn thành">' + CHECK + '</button><span class="tt">' + esc(t.t) +
          '</span><button class="xbtn" data-act="del" data-d="' + i + '" data-id="' + esc(t.id) + '" aria-label="Xóa việc">×</button></li>';
      });
      h += '</ul><form class="addf" data-form="task" data-d="' + i + '"><input id="add-d' + i + '" type="text" maxlength="200" placeholder="Thêm việc" aria-label="Thêm việc cho ' + DAYS_LONG[i] + '" autocomplete="off"><button type="submit">Thêm</button></form></div>';
    });
    h += "</div></section>";

    /* quản lý thói quen */
    h += '<section class="card"><details class="manage"' + (manageOpen ? " open" : "") + "><summary>Quản lý thói quen</summary><div class=\"mlist\">";
    H.forEach(function (hb) {
      var ask = confirmDel === hb.id;
      h += '<div class="mrow"><input type="text" maxlength="80" value="' + esc(hb.name) + '" data-act="hname" data-h="' + esc(hb.id) + '" aria-label="Tên thói quen"><button class="btn danger" data-act="hdel" data-h="' + esc(hb.id) + '">' + (ask ? "Xác nhận xóa" : "Xóa") + "</button></div>";
    });
    h += '<form class="mrow" data-form="habit"><input id="add-habit" type="text" maxlength="80" placeholder="Thói quen mới" aria-label="Tên thói quen mới" autocomplete="off"><button class="btn primary" type="submit">Thêm</button></form>';
    h += '<p class="empty">Xóa một thói quen chỉ ẩn nó khỏi danh sách. Lịch sử tick của các tuần cũ vẫn được giữ.</p></div></details></section>';
    return h;
  }

  function chartSvg(weeks) {
    var W = 640, Hh = 190, L = 34, B = 24, T = 8, plotH = Hh - B - T, n = weeks.length, slot = (W - L - 8) / n, bw = Math.min(18, slot / 2 - 3);
    var s = '<svg class="chart" viewBox="0 0 ' + W + " " + Hh + '" role="img" aria-label="Biểu đồ tỷ lệ hoàn thành thói quen và việc cần làm theo tuần">';
    [0, 50, 100].forEach(function (v) {
      var y = T + plotH - plotH * v / 100;
      s += '<line class="grid" x1="' + L + '" x2="' + (W - 8) + '" y1="' + y + '" y2="' + y + '"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end">' + v + "%</text>";
    });
    weeks.forEach(function (wk, i) {
      var st = weekStats(wk), cx = L + slot * i + slot / 2, hh = plotH * st.hp / 100, th = plotH * st.tp / 100;
      if (st.any) {
        s += '<rect class="b-h" x="' + (cx - bw - 1) + '" y="' + (T + plotH - hh) + '" width="' + bw + '" height="' + Math.max(hh, 1) + '" rx="3"/>';
        s += '<rect class="b-t" x="' + (cx + 1) + '" y="' + (T + plotH - th) + '" width="' + bw + '" height="' + Math.max(th, 1) + '" rx="3"/>';
      }
      s += '<text x="' + cx + '" y="' + (Hh - 6) + '" text-anchor="middle">' + fmt(wk) + "</text>";
    });
    return s + "</svg>";
  }

  function overView() {
    var H = habits(), thisMon = mondayOf(new Date()), i, recent = [];
    for (i = 7; i >= 0; i--) recent.push(addDays(thisMon, -7 * i));
    var all = Object.keys(S.weeks).filter(function (k) { return weekStats(k).any; });
    if (all.indexOf(thisMon) < 0) all.push(thisMon);
    all.sort().reverse();
    var hasData = Object.keys(S.weeks).some(function (k) { return weekStats(k).any; });

    var h = '<section class="card"><div class="sec-h"><h2>8 tuần gần nhất</h2><span class="sub">Mỗi cột là tỷ lệ hoàn thành trong tuần</span></div>';
    if (!hasData) h += '<p class="empty">Chưa có dữ liệu. Tick thói quen hoặc thêm việc ở tab Tuần, biểu đồ sẽ hiện ở đây.</p>';
    else h += '<div class="legend"><span><i style="background:var(--accent)"></i>Thói quen</span><span><i style="background:var(--task)"></i>Việc cần làm</span></div>' + chartSvg(recent);
    h += "</section>";

    h += '<section class="card"><div class="sec-h"><h2>Chuỗi thói quen</h2><span class="sub">Tính đến hôm nay</span></div><div class="scroll srows"><div class="hrow head"><div class="nm">Thói quen</div><div>Chuỗi hiện tại</div><div>Chuỗi dài nhất</div><div>30 ngày qua</div></div>';
    if (!H.length) h += '<p class="empty">Chưa có thói quen nào.</p>';
    H.forEach(function (hb) {
      h += '<div class="hrow"><div class="nm">' + esc(hb.name) + '</div><div class="v">' + streak(hb.id) + ' ngày</div><div class="v">' + bestStreak(hb.id) + ' ngày</div><div class="v">' + habitRate(hb.id, 30) + "%</div></div>";
    });
    h += "</div></section>";

    h += '<section class="card"><div class="sec-h"><h2>Tất cả các tuần</h2><span class="sub">Bấm vào một tuần để xem và sửa lại</span></div><div class="wlist">';
    all.forEach(function (wk) {
      var st = weekStats(wk), e = addDays(wk, 6);
      h += '<button class="wrow" data-act="open" data-wk="' + wk + '"><b class="tn">' + fmt(wk) + " – " + fmt(e) + "/" + parse(e).getFullYear() + (wk === thisMon ? " · tuần này" : "") + "</b>" +
        '<div class="mini"><small class="tn">Việc ' + st.td + "/" + st.tt + '</small><div class="bar"><i style="width:' + st.tp + '%"></i></div></div>' +
        '<div class="mini"><small class="tn">Thói quen ' + st.hp + '%</small><div class="bar"><i class="h" style="width:' + st.hp + '%"></i></div></div></button>';
    });
    return h + "</div></section>";
  }

  function foot() {
    return '<section class="card foot"><button class="btn" data-act="export">Sao lưu ra file</button><button class="btn" data-act="import">Khôi phục từ file</button>' +
      '<input type="file" id="import-file" accept="application/json,.json" hidden><span class="hint">File sao lưu chứa toàn bộ các tuần, thói quen và việc cần làm của bạn.</span></section>';
  }

  function render() {
    app.innerHTML = head() + (view === "week" ? weekView() : overView()) + foot();
    if (focusId) { var el = document.getElementById(focusId); if (el) el.focus(); focusId = null; }
  }

  /* ---------- thao tác ---------- */
  function touchWeek(wk) { queue("w_" + wk); }
  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t || t.tagName === "INPUT") return;
    var act = t.getAttribute("data-act");
    if (act !== "hdel") confirmDel = null;
    var W, hid, i, d;
    switch (act) {
      case "login": login(); break;
      case "logout": logout(); break;
      case "tab": view = t.getAttribute("data-v"); render(); break;
      case "prev": cur = addDays(cur, -7); render(); break;
      case "next": cur = addDays(cur, 7); render(); break;
      case "today": cur = mondayOf(new Date()); render(); break;
      case "open": cur = t.getAttribute("data-wk"); view = "week"; render(); window.scrollTo(0, 0); break;
      case "hab":
        hid = t.getAttribute("data-h"); i = +t.getAttribute("data-i"); W = getW(cur);
        if (!W.habits[hid]) W.habits[hid] = [false, false, false, false, false, false, false];
        W.habits[hid][i] = !W.habits[hid][i];
        touchWeek(cur); render(); break;
      case "tk":
        d = +t.getAttribute("data-d"); W = getW(cur);
        W.tasks[d].forEach(function (x) { if (x.id === t.getAttribute("data-id")) x.d = !x.d; });
        touchWeek(cur); render(); break;
      case "del":
        d = +t.getAttribute("data-d"); W = getW(cur);
        W.tasks[d] = W.tasks[d].filter(function (x) { return x.id !== t.getAttribute("data-id"); });
        touchWeek(cur); render(); break;
      case "hdel":
        hid = t.getAttribute("data-h");
        if (confirmDel === hid) {
          S.habits = habits().filter(function (x) { return x.id !== hid; });
          confirmDel = null; queue("config");
        } else confirmDel = hid;
        render(); break;
      case "export": doExport(); break;
      case "import": document.getElementById("import-file").click(); break;
    }
  });
  app.addEventListener("submit", function (e) {
    var f = e.target.closest("form");
    if (!f) return;
    e.preventDefault();
    var input = f.querySelector("input"), v = input.value.trim();
    if (!v) return;
    if (f.getAttribute("data-form") === "task") {
      var d = +f.getAttribute("data-d");
      getW(cur).tasks[d].push({ id: uid(), t: v, d: false });
      touchWeek(cur); focusId = "add-d" + d; render();
    } else {
      S.habits = habits().concat([{ id: "h_" + uid(), name: v }]);
      queue("config"); focusId = "add-habit"; render();
    }
  });
  app.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "import-file") { doImport(t); return; }
    if (t.getAttribute && t.getAttribute("data-act") === "hname") {
      var hid = t.getAttribute("data-h"), v = t.value.trim();
      if (!v) { render(); return; }
      S.habits = habits().map(function (x) { return x.id === hid ? { id: x.id, name: v } : x; });
      queue("config"); render();
    }
  });
  app.addEventListener("toggle", function (e) {
    if (e.target && e.target.classList && e.target.classList.contains("manage")) manageOpen = e.target.open;
  }, true);

  function doExport() {
    var data = JSON.stringify({ v: 1, habits: habits(), weeks: S.weeks }, null, 2);
    var name = "nhip-tuan-sao-luu-" + todayKey() + ".json";
    var c = window.claude;
    if (!c || !c.use) {
      try {
        var url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
        var a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        setStatus("Đã tạo file sao lưu.");
      } catch (err) { setStatus("Không tạo được file sao lưu."); }
      return;
    }
    c.use("downloads").then(function (dl) {
      if (!dl) { setStatus("Không tải được file ở chế độ xem này. Hãy mở trang trong Claude."); return; }
      return dl.save({ filename: name, data: data }).then(function () { setStatus("Đã tạo file sao lưu."); });
    }).catch(function (err) {
      if (err && err.code === "declined") return;
      setStatus("Không tạo được file sao lưu.");
    });
  }
  function doImport(input) {
    var f = input.files && input.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var o = JSON.parse(String(r.result));
        if (!o || typeof o.weeks !== "object") throw new Error("bad");
        if (Array.isArray(o.habits)) { S.habits = o.habits.filter(function (h) { return h && h.id && typeof h.name === "string"; }); queue("config"); }
        Object.keys(o.weeks).forEach(function (wk) {
          var src = o.weeks[wk] || {};
          S.weeks[wk] = normalizeWeek({ tasks: tasksToObj(src.tasks), habits: src.habits });
          touchWeek(wk);
        });
        setStatus("Đã khôi phục " + Object.keys(o.weeks).length + " tuần từ file.");
        render();
      } catch (err) { setStatus("File không đúng định dạng sao lưu của Nhịp Tuần."); }
    };
    r.readAsText(f);
    input.value = "";
  }

  init();
})();
</script>

</body>
</html>
