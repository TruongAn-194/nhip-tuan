<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Quản lý cá nhân</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Bố cục: dashboard thẻ trắng trên nền xám xanh; hàng chỉ số, hàng điểm + thống kê tuần, hàng thói quen + tỷ lệ từ trước đến nay, rồi việc cần làm */
:root {
  --bg: #f1f4f9;
  --surface: #ffffff;
  --band: #f7f8fa;
  --fg: #0f172a;
  --muted: #64748b;
  --line: #e5e9f0;
  --b1: #2563eb;
  --b2: #7ea2f5;
  --b3: #e1e9fc;
  --on: #ffffff;
  --pos: #15a06f;
  --pos-bg: #e2f7ee;
  --neg: #d63b3b;
  --neg-bg: #fde9e9;
  --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 8px 24px rgba(15, 23, 42, .05);
  --red-bg: #fdecec; --red-hd: #f9cfcf; --red-fg: #8a1f1f; --red-line: #e5484d;
  --grn-bg: #e4f6ec; --grn-hd: #bde8d3; --grn-fg: #0f5c3f; --grn-line: #2fb36f;
  --font-display: "Be Vietnam Pro", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c111d;
    --surface: #141b2b;
    --band: #19223a;
    --fg: #e8edf7;
    --muted: #92a0ba;
    --line: #243049;
    --b1: #5b8cff;
    --b2: #35508f;
    --b3: #212c47;
    --on: #0b1226;
    --pos: #4fd3a0;
    --pos-bg: #14352b;
    --neg: #ff8d8d;
    --neg-bg: #3a1f25;
    --shadow: none;
    --red-bg: #3a1d24; --red-hd: #522730; --red-fg: #ffb3b3; --red-line: #ff6b72;
    --grn-bg: #14342a; --grn-hd: #1c4a3b; --grn-fg: #a5f0cc; --grn-line: #4fd3a0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c111d;
  --surface: #141b2b;
  --band: #19223a;
  --fg: #e8edf7;
  --muted: #92a0ba;
  --line: #243049;
  --b1: #5b8cff;
  --b2: #35508f;
  --b3: #212c47;
  --on: #0b1226;
  --pos: #4fd3a0;
  --pos-bg: #14352b;
  --neg: #ff8d8d;
  --neg-bg: #3a1f25;
  --shadow: none;
  --red-bg: #3a1d24; --red-hd: #522730; --red-fg: #ffb3b3; --red-line: #ff6b72;
  --grn-bg: #14342a; --grn-hd: #1c4a3b; --grn-fg: #a5f0cc; --grn-line: #4fd3a0;
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--b1); outline-offset: 2px; }
.muted { color: var(--muted); }
.tn { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.wrap > * { min-width: 0; }

/* đầu trang */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.top h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.015em; }
.top .date { color: var(--muted); font-size: 14px; }
.status { color: var(--muted); font-size: 13px; text-align: right; max-width: 380px; }
.weekbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.wnav { display: flex; align-items: center; gap: 6px; }
.iconbtn { width: 38px; height: 38px; border-radius: 11px; border: 0; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; }
.iconbtn:hover { background: var(--b3); }
.wlabel { font-family: var(--font-display); font-weight: 600; font-size: 18px; min-width: 160px; text-align: center; }
.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 500; background: var(--b3); color: var(--fg); }
.pill.past { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.linkbtn { background: none; border: 0; color: var(--b1); font-weight: 600; padding: 4px 6px; text-decoration: underline; text-underline-offset: 3px; }

/* thẻ */
.card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.ch { background: var(--band); padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }
.ch h2 { font-size: 16px; font-weight: 600; }
.ch .sub { color: var(--muted); font-size: 13px; }
.cb { padding: 20px; flex: 1; min-width: 0; }
.cf { background: var(--band); border: 0; width: 100%; padding: 14px 20px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-weight: 500; font-size: 15px; }
.cf:hover { color: var(--fg); background: var(--b3); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
.chip.up { background: var(--pos-bg); color: var(--pos); }
.chip.down { background: var(--neg-bg); color: var(--neg); }
.chip.flat { background: var(--band); color: var(--muted); }

/* chỉ số */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
.kb { padding: 18px 20px 16px; flex: 1; }
.kt { font-weight: 500; font-size: 15px; }
.krow { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: 8px; }
.knum { font-family: var(--font-display); font-weight: 600; font-size: 52px; line-height: 1.05; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kunit { font-size: 17px; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.ksub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; color: var(--muted); font-size: 14px; margin-top: 6px; }
.kviz { flex: none; display: flex; align-items: flex-end; }
.m-ghost { fill: var(--b3); }
.m-solid { fill: var(--b1); }
.donut .d-track { stroke: var(--b3); }
.donut .d-val { stroke: var(--b1); }
.spark-line { stroke: var(--b1); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* điểm + thống kê */
.row2 { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 20px; }
.gaugebox { position: relative; max-width: 300px; margin: 4px auto 0; }
.gauge { width: 100%; height: auto; display: block; }
.g-track { fill: none; stroke: var(--b2); stroke-width: 24; }
.g-val { fill: none; stroke: var(--b1); stroke-width: 24; }
.g-ticks { fill: none; stroke: var(--muted); stroke-width: 9; opacity: .55; }
.gtext { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; }
.gtext b { display: block; font-family: var(--font-display); font-size: 44px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
.gtext span { color: var(--muted); font-size: 13px; }
.gmsg { margin-top: 16px; }
.gmsg b { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.gmsg p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.gnote { margin-top: 10px; color: var(--muted); font-size: 12px; }
.rangesel { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; font-size: 14px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chartscroll { overflow-x: auto; }
.chartin { position: relative; min-width: 640px; }
.matrix { width: 100%; height: auto; display: block; }
.matrix text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.matrix .grid { stroke: var(--line); stroke-width: 1; }
.matrix .c-on { fill: var(--b1); }
.matrix .c-off { fill: var(--b3); opacity: .7; }
.matrix .sel { fill: var(--b3); opacity: .5; }
.matrix .hit { fill: transparent; cursor: pointer; }
.matrix .hit:hover { fill: var(--b3); opacity: .35; }
.tip { position: absolute; z-index: 2; pointer-events: none; background: var(--surface); box-shadow: 0 6px 24px rgba(15, 23, 42, .18); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; white-space: nowrap; }
.tip b { font-family: var(--font-display); font-size: 14px; }
.tip span { color: var(--muted); }

/* thói quen */
.row3 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 20px; }
.scroll { overflow-x: auto; }
.hgrid { min-width: 640px; display: flex; flex-direction: column; gap: 8px; }
.hrow { display: grid; grid-template-columns: minmax(130px, 1.2fr) repeat(7, minmax(36px, 1fr)) 50px 76px; gap: 8px; align-items: center; }
.hrow.head { font-size: 12px; color: var(--muted); text-align: center; padding-bottom: 2px; }
.hrow .nm { font-weight: 500; overflow-wrap: anywhere; padding-right: 6px; }
.hrow.head .nm { text-align: left; font-weight: 400; }
.dcol { display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
.dcol.today b { color: var(--b1); }
.dcol small { font-size: 11px; }
.cell { height: 38px; width: 100%; border-radius: 10px; border: 0; background: var(--b3); display: grid; place-items: center; padding: 0; color: var(--on); }
.cell:hover { outline: 2px solid var(--b2); outline-offset: -2px; }
.cell[aria-pressed="true"] { background: var(--b1); }
.cell svg { width: 16px; height: 16px; display: none; }
.cell[aria-pressed="true"] svg { display: block; }
.pct { text-align: center; font-weight: 600; font-size: 14px; }
.stk { text-align: center; font-size: 13px; color: var(--muted); }
.stk b { color: var(--fg); font-size: 15px; font-family: var(--font-display); }
.empty { color: var(--muted); font-size: 13px; margin: 0; }

.drow { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.dbig { font-family: var(--font-display); font-size: 38px; font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; }
.dbig small { font-size: 16px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.hlist { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
.hl .t { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.hl .t span:first-child { overflow-wrap: anywhere; }
.hl .t b { font-variant-numeric: tabular-nums; }
.hl small { color: var(--muted); font-size: 12px; }
.bar { height: 6px; border-radius: 99px; background: var(--b3); overflow: hidden; margin: 5px 0 3px; }
.bar i { display: block; height: 100%; background: var(--b1); border-radius: 99px; }

/* việc cần làm */
.days { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.day { background: var(--band); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.day.today { outline: 2px solid var(--b1); outline-offset: -2px; }
.dh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.dh b { font-family: var(--font-display); font-weight: 600; font-size: 14px; }
.dh span { color: var(--muted); font-size: 12px; }
.prog { font-size: 12px; color: var(--muted); margin-top: -4px; }
.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; min-height: 28px; }
.task { display: flex; align-items: flex-start; gap: 8px; }
.tk { flex: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 1.5px solid var(--b2); background: transparent; display: grid; place-items: center; padding: 0; color: var(--on); }
.tk:hover { border-color: var(--b1); }
.tk[aria-pressed="true"] { background: var(--b1); border-color: var(--b1); }
.tk svg { width: 12px; height: 12px; display: none; }
.tk[aria-pressed="true"] svg { display: block; }
.tt { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.task.done .tx { color: var(--muted); text-decoration: line-through; }
.tdone { display: block; color: var(--muted); font-size: 12px; margin-top: 1px; font-variant-numeric: tabular-nums; }
.xbtn { flex: none; background: none; border: 0; color: var(--muted); width: 24px; height: 24px; border-radius: 6px; padding: 0; line-height: 1; font-size: 16px; }
.xbtn:hover { color: var(--neg); }
.addf, .mrow { display: flex; gap: 6px; }
.addf { margin-top: auto; }
.addf input, .mrow input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; background: var(--surface); font-size: 14px; }
.addf input::placeholder, .mrow input::placeholder { color: var(--muted); }
.btn, .addf button { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 12px; font-weight: 600; font-size: 14px; }
.btn:hover, .addf button:hover { border-color: var(--b1); }
.btn.primary { background: var(--b1); color: var(--on); border-color: var(--b1); }
.btn.danger { color: var(--neg); }

/* lịch tuần theo giờ */
.ctform { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.ctform input[type="text"] { flex: 1 1 220px; min-width: 0; }
.ctform input, .ctform select { border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; background: var(--surface); font-size: 14px; }
.tfield { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); }
.ctnote { font-size: 13px; color: var(--muted); margin: 8px 0 14px; }
.ctnote.err { color: var(--neg); }
.calscroll { overflow-x: auto; margin-top: 12px; }
.cal { min-width: 780px; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
.cal-row { display: grid; grid-template-columns: 56px repeat(7, minmax(0, 1fr)); }
.cal-head { border-bottom: 1px solid var(--line); }
.chd { padding: 8px 6px; border-left: 1px solid var(--line); text-align: center; display: flex; flex-direction: column; line-height: 1.35; }
.chd b { font-family: var(--font-display); font-size: 14px; font-weight: 600; }
.chd span { font-size: 12px; color: var(--muted); }
.chd small { font-size: 11px; color: var(--muted); }
.chd.today { background: var(--band); }
.chd.today b { color: var(--b1); }
.cal-all { border-bottom: 1px solid var(--line); }
.cal-all .lab { font-size: 11px; color: var(--muted); display: grid; place-items: center; padding: 4px; text-align: center; }
.adcell { border-left: 1px solid var(--line); padding: 4px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.adcell.today { background: var(--band); }
.adc { position: relative; display: flex; align-items: flex-start; gap: 6px; padding: 5px 22px 5px 6px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border-left: 3px solid var(--ln-c); background: var(--bg-c); color: var(--fg-c); min-width: 0; }
.adk { flex: none; width: 14px; height: 14px; margin-top: 1px; border-radius: 50%; border: 1.5px solid var(--ln-c); display: grid; place-items: center; }
.adk svg { width: 9px; height: 9px; }
.adc.done .adk { background: var(--ln-c); color: var(--surface); }
.adt { min-width: 0; overflow-wrap: anywhere; line-height: 1.3; }
.tcol.hours { position: relative; }
.tcol.hours span { position: absolute; right: 8px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
.dbody { position: relative; border-left: 1px solid var(--line); cursor: cell; background-image: repeating-linear-gradient(to bottom, transparent 0, transparent calc(var(--pxh) - 1px), var(--line) calc(var(--pxh) - 1px), var(--line) var(--pxh)); }
.dbody.today { background-color: var(--band); }
.tb.todo, .adc.todo { --bg-c: var(--red-bg); --hd-c: var(--red-hd); --fg-c: var(--red-fg); --ln-c: var(--red-line); }
.tb.done, .adc.done { --bg-c: var(--grn-bg); --hd-c: var(--grn-hd); --fg-c: var(--grn-fg); --ln-c: var(--grn-line); }
.tb { position: absolute; border-radius: 8px; overflow: hidden; font-size: 12px; background: var(--bg-c); color: var(--fg-c); border-left: 3px solid var(--ln-c); cursor: pointer; display: flex; flex-direction: column; z-index: 1; }
.tb:hover, .adc:hover { filter: brightness(.97); }
.tb-h { background: var(--hd-c); padding: 2px 22px 2px 6px; font-weight: 600; font-size: 11px; display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.tb-st svg { width: 12px; height: 12px; display: block; }
.tb-t { padding: 4px 6px; font-weight: 600; line-height: 1.25; overflow: hidden; overflow-wrap: anywhere; }
.tb .tdone { padding: 0 6px 4px; color: inherit; opacity: .8; }
.tb.short .tb-h { display: none; }
.tb.short .tb-t { padding: 2px 22px 2px 6px; white-space: nowrap; text-overflow: ellipsis; }
.tb .xbtn, .adc .xbtn { position: absolute; top: 1px; right: 2px; width: 20px; height: 20px; color: inherit; opacity: .6; }
.tb .xbtn:hover, .adc .xbtn:hover { opacity: 1; color: inherit; }
.tedit { width: 100%; min-width: 0; font: inherit; font-size: 12px; font-weight: 600; color: var(--fg); background: var(--surface); border: 1px solid var(--ln-c, var(--b1)); border-radius: 6px; padding: 2px 5px; cursor: text; user-select: text; -webkit-user-select: text; }
.weekbar .tfield input { border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; background: var(--surface); font-size: 14px; }
#sec-tasks { overflow: visible; }
#sec-tasks > .ch { border-radius: 18px 18px 0 0; }
#sec-tasks .wnav { margin-left: auto; margin-right: 12px; }
#sec-tasks .wlabel { min-width: 130px; font-size: 16px; }
.calwrap { position: relative; }
.calnav { position: absolute; top: 0; bottom: 0; width: 36px; z-index: 6; pointer-events: none; }
.calnav.l { left: -18px; }
.calnav.r { right: -18px; }
.calnav button { pointer-events: auto; position: sticky; top: calc(50vh - 18px); width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--line); background: color-mix(in srgb, var(--surface) 85%, transparent); color: var(--fg); display: grid; place-items: center; padding: 0; box-shadow: 0 4px 14px rgba(15, 23, 42, .25); -webkit-backdrop-filter: blur(4px); backdrop-filter: blur(4px); opacity: .75; transition: opacity .15s, background .15s; }
.calnav button:hover, .calnav button:focus-visible { opacity: 1; background: var(--b3); }
.nowline { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--b1); z-index: 3; pointer-events: none; }
.nowline::before { content: ""; position: absolute; left: -4px; top: -5px; width: 8px; height: 8px; border-radius: 50%; background: var(--b1); }

/* kéo thả */
.tb, .adc { cursor: grab; user-select: none; -webkit-user-select: none; }
.tb .xbtn, .adc .xbtn { z-index: 3; }
.tb.dragging, .adc.dragging { opacity: .35; }
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }
body.dragging.rz, body.dragging.rz * { cursor: ns-resize !important; }
.ghost { position: fixed; z-index: 60; pointer-events: none; box-sizing: border-box; overflow: hidden; border-radius: 8px; border: 2px dashed var(--b1); background: color-mix(in srgb, var(--b1) 16%, transparent); color: var(--b1); font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; padding: 3px 8px; }
.adcell.drop { outline: 2px dashed var(--b1); outline-offset: -2px; background: var(--b3); }
.rsz { position: absolute; left: 0; right: 0; height: 8px; cursor: ns-resize; touch-action: none; z-index: 2; }
.rsz-t { top: 0; }
.rsz-b { bottom: 0; }
.rsz::after { content: ""; position: absolute; left: 50%; width: 22px; height: 3px; margin-left: -11px; border-radius: 2px; background: currentColor; opacity: 0; transition: opacity .15s; }
.rsz-t::after { top: 2px; }
.rsz-b::after { bottom: 2px; }
.tb:hover .rsz::after { opacity: .45; }

/* danh sách tuần */
.wlist { display: flex; flex-direction: column; }
.wrow { display: grid; grid-template-columns: minmax(130px, 1.2fr) 1fr 1fr; gap: 8px 20px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 8px; border-radius: 0; }

/* quản lý, sao lưu */
details.manage summary { cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.mlist { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.foot .hint { color: var(--muted); font-size: 13px; flex-basis: 100%; }

/* đăng nhập */
.auth { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; padding: 16px 20px; }
.auth b { font-family: var(--font-display); }
.authline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13px; }

/* thanh mục + tài chính */
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.tab { border: 0; background: var(--surface); box-shadow: var(--shadow); border-radius: 12px; padding: 10px 16px; font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--fg); }
.tab:hover { background: var(--b3); }
.tab[aria-selected="true"] { background: var(--b1); color: var(--on); }
.kpis.fin .knum { font-size: 34px; }
.fgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
.alist { display: flex; flex-direction: column; }
.arow { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-top: 1px solid var(--line); font-size: 14px; }
.arow:first-child { border-top: 0; }
.arow.total { border-top: 2px solid var(--line); font-weight: 600; }
.neg { color: var(--neg); }
.pos { color: var(--pos); }
.txr { display: grid; grid-template-columns: 52px 76px minmax(0, 1fr) auto 28px; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); font-size: 14px; }
.txr:first-child { border-top: 0; }
.txr .txt { overflow-wrap: anywhere; }
.fbadge { display: inline-block; text-align: center; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.fbadge.in { background: var(--pos-bg); color: var(--pos); }
.fbadge.out { background: var(--neg-bg); color: var(--neg); }
.fbadge.tr { background: var(--b3); color: var(--fg); }
.ftable { border-collapse: separate; border-spacing: 0; min-width: 1040px; width: 100%; font-size: 13px; }
.ftable th, .ftable td { padding: 7px 8px; text-align: right; border-top: 1px solid var(--line); white-space: nowrap; background: var(--surface); }
.ftable thead th { border-top: 0; color: var(--muted); font-weight: 500; }
.ftable th:first-child { text-align: left; position: sticky; left: 0; z-index: 1; min-width: 150px; font-weight: 500; }
.ftable tr.grp th, .ftable tr.grp td { background: var(--band); font-weight: 600; }
.ftable td.sel, .ftable th.sel { background: var(--b3); }
.ftable td.tot { font-weight: 600; }
.mbtn { border: 0; background: none; font-weight: 600; color: var(--fg); border-radius: 6px; padding: 2px 8px; }
.mbtn:hover { background: var(--b3); }
.oname { flex: 0 0 200px; align-self: center; font-size: 14px; }
@media (max-width: 560px) {
  .txr { grid-template-columns: 44px minmax(0, 1fr) auto 24px; }
  .txr .fbadge { display: none; }
  .oname { flex-basis: 130px; }
}

@media (max-width: 900px) {
  .row2, .row3 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .wlabel { min-width: 0; font-size: 16px; }
  .status { text-align: left; }
  .knum { font-size: 44px; }
  .wrow { grid-template-columns: 1fr 1fr; }
  .wrow > b { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width .25s ease; }
}

    document.addEventListener("pointercancel", onDragCancel);
    document.addEventListener("keydown", onDragKey);
  });
  setInterval(updateNow, 60000);
  app.addEventListener("mousemove", function (e) {
    var el = document.getElementById("tip");
    if (!el) return;
    var h = e.target.closest ? e.target.closest(".hit") : null;
    if (!h) { el.hidden = true; return; }
    var p = h.getAttribute("data-tip").split("|"), box = el.parentNode.getBoundingClientRect();
    el.innerHTML = "<b>" + esc(p[0]) + "</b><span>" + esc(p[1]) + "</span><span>" + esc(p[2]) + "</span>";
    el.hidden = false;
    var x = e.clientX - box.left + 14, y = e.clientY - box.top - 8;
    el.style.left = Math.max(4, Math.min(x, box.width - el.offsetWidth - 4)) + "px";
    el.style.top = Math.max(0, y) + "px";
  });
  app.addEventListener("mouseleave", function () { var el = document.getElementById("tip"); if (el) el.hidden = true; });

  function doExport() {
    var data = JSON.stringify({ v: 2, habits: habits(), weeks: S.weeks, fin: S.fin }, null, 2);
    var name = "quan-ly-ca-nhan-sao-luu-" + todayKey() + ".json";
    var c = window.claude;
    if (!c || !c.use) {
      try {
        var url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
        var a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        setStatus("Đã tạo file sao lưu.");
      } catch (err) { setStatus("Không tạo được file sao lưu."); }
      return;
    }
    c.use("downloads").then(function (dl) {
      if (!dl) { setStatus("Không tải được file ở chế độ xem này. Hãy mở trang trong Claude."); return; }
      return dl.save({ filename: name, data: data }).then(function () { setStatus("Đã tạo file sao lưu."); });
    }).catch(function (err) {
      if (err && err.code === "declined") return;
      setStatus("Không tạo được file sao lưu.");
    });
  }
  function doImport(input) {
    var f = input.files && input.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var o = JSON.parse(String(r.result));
        if (!o || typeof o.weeks !== "object") throw new Error("bad");
        if (Array.isArray(o.habits)) { S.habits = o.habits.filter(function (h) { return h && h.id && typeof h.name === "string"; }); queue("config"); }
        Object.keys(o.weeks).forEach(function (wk) {
          var src = o.weeks[wk] || {};
          S.weeks[wk] = normalizeWeek({ tasks: tasksToObj(src.tasks), habits: src.habits });
          touchWeek(wk);
        });
        if (o.fin) importFin(o.fin);
        setStatus("Đã khôi phục " + Object.keys(o.weeks).length + " tuần từ file.");
        render();
      } catch (err) { setStatus("File không đúng định dạng sao lưu của Quản lý cá nhân."); }
    };
    r.readAsText(f);
    input.value = "";
  }

  init();
})();
</script>
