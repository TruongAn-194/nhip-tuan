<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Kế hoạch tuần</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Bố cục: dashboard thẻ trắng trên nền xám xanh; hàng chỉ số, hàng điểm + thống kê tuần, hàng thói quen + tỷ lệ 30 ngày, rồi việc cần làm */
:root {
  --bg: #f1f4f9;
  --surface: #ffffff;
  --band: #f7f8fa;
  --fg: #0f172a;
  --muted: #64748b;
  --line: #e5e9f0;
  --b1: #2563eb;
  --b2: #7ea2f5;
  --b3: #e1e9fc;
  --on: #ffffff;
  --pos: #15a06f;
  --pos-bg: #e2f7ee;
  --neg: #d63b3b;
  --neg-bg: #fde9e9;
  --shadow: 0 1px 2px rgba(15, 23, 42, .04), 0 8px 24px rgba(15, 23, 42, .05);
  --font-display: "Be Vietnam Pro", "Inter", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c111d;
    --surface: #141b2b;
    --band: #19223a;
    --fg: #e8edf7;
    --muted: #92a0ba;
    --line: #243049;
    --b1: #5b8cff;
    --b2: #35508f;
    --b3: #212c47;
    --on: #0b1226;
    --pos: #4fd3a0;
    --pos-bg: #14352b;
    --neg: #ff8d8d;
    --neg-bg: #3a1f25;
    --shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c111d;
  --surface: #141b2b;
  --band: #19223a;
  --fg: #e8edf7;
  --muted: #92a0ba;
  --line: #243049;
  --b1: #5b8cff;
  --b2: #35508f;
  --b3: #212c47;
  --on: #0b1226;
  --pos: #4fd3a0;
  --pos-bg: #14352b;
  --neg: #ff8d8d;
  --neg-bg: #3a1f25;
  --shadow: none;
  color-scheme: dark;
}
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.5;
  padding-block: 28px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
[hidden] { display: none !important; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--b1); outline-offset: 2px; }
.muted { color: var(--muted); }
.tn { font-variant-numeric: tabular-nums; }
.wrap { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
.wrap > * { min-width: 0; }

/* đầu trang */
.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 16px; }
.top h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.015em; }
.top .date { color: var(--muted); font-size: 14px; }
.status { color: var(--muted); font-size: 13px; text-align: right; max-width: 380px; }
.weekbar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.wnav { display: flex; align-items: center; gap: 6px; }
.iconbtn { width: 38px; height: 38px; border-radius: 11px; border: 0; background: var(--surface); box-shadow: var(--shadow); display: grid; place-items: center; }
.iconbtn:hover { background: var(--b3); }
.wlabel { font-family: var(--font-display); font-weight: 600; font-size: 18px; min-width: 160px; text-align: center; }
.pill { display: inline-flex; align-items: center; border-radius: 999px; padding: 4px 12px; font-size: 13px; font-weight: 500; background: var(--b3); color: var(--fg); }
.pill.past { background: transparent; border: 1px solid var(--line); color: var(--muted); }
.linkbtn { background: none; border: 0; color: var(--b1); font-weight: 600; padding: 4px 6px; text-decoration: underline; text-underline-offset: 3px; }

/* thẻ */
.card { background: var(--surface); border-radius: 18px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.ch { background: var(--band); padding: 14px 20px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; }
.ch h2 { font-size: 16px; font-weight: 600; }
.ch .sub { color: var(--muted); font-size: 13px; }
.cb { padding: 20px; flex: 1; min-width: 0; }
.cf { background: var(--band); border: 0; width: 100%; padding: 14px 20px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--muted); font-weight: 500; font-size: 15px; }
.cf:hover { color: var(--fg); background: var(--b3); }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 13px; font-weight: 500; font-variant-numeric: tabular-nums; }
.chip.up { background: var(--pos-bg); color: var(--pos); }
.chip.down { background: var(--neg-bg); color: var(--neg); }
.chip.flat { background: var(--band); color: var(--muted); }

/* chỉ số */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; }
.kb { padding: 18px 20px 16px; flex: 1; }
.kt { font-weight: 500; font-size: 15px; }
.krow { display: flex; align-items: flex-end; justify-content: space-between; gap: 10px; margin-top: 8px; }
.knum { font-family: var(--font-display); font-weight: 600; font-size: 52px; line-height: 1.05; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; }
.kunit { font-size: 17px; font-weight: 500; color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.ksub { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; color: var(--muted); font-size: 14px; margin-top: 6px; }
.kviz { flex: none; display: flex; align-items: flex-end; }
.m-ghost { fill: var(--b3); }
.m-solid { fill: var(--b1); }
.donut .d-track { stroke: var(--b3); }
.donut .d-val { stroke: var(--b1); }
.spark-line { stroke: var(--b1); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* điểm + thống kê */
.row2 { display: grid; grid-template-columns: minmax(0, 360px) minmax(0, 1fr); gap: 20px; }
.gaugebox { position: relative; max-width: 300px; margin: 4px auto 0; }
.gauge { width: 100%; height: auto; display: block; }
.g-track { fill: none; stroke: var(--b2); stroke-width: 24; }
.g-val { fill: none; stroke: var(--b1); stroke-width: 24; }
.g-ticks { fill: none; stroke: var(--muted); stroke-width: 9; opacity: .55; }
.gtext { position: absolute; left: 0; right: 0; bottom: 2px; text-align: center; }
.gtext b { display: block; font-family: var(--font-display); font-size: 44px; font-weight: 600; line-height: 1; letter-spacing: -0.02em; }
.gtext span { color: var(--muted); font-size: 13px; }
.gmsg { margin-top: 16px; }
.gmsg b { font-family: var(--font-display); font-size: 16px; font-weight: 600; }
.gmsg p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.gnote { margin-top: 10px; color: var(--muted); font-size: 12px; }
.rangesel { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 6px 10px; font-size: 14px; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.chartscroll { overflow-x: auto; }
.chartin { position: relative; min-width: 640px; }
.matrix { width: 100%; height: auto; display: block; }
.matrix text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.matrix .grid { stroke: var(--line); stroke-width: 1; }
.matrix .c-on { fill: var(--b1); }
.matrix .c-off { fill: var(--b3); opacity: .7; }
.matrix .sel { fill: var(--b3); opacity: .5; }
.matrix .hit { fill: transparent; cursor: pointer; }
.matrix .hit:hover { fill: var(--b3); opacity: .35; }
.tip { position: absolute; z-index: 2; pointer-events: none; background: var(--surface); box-shadow: 0 6px 24px rgba(15, 23, 42, .18); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; font-size: 13px; white-space: nowrap; }
.tip b { font-family: var(--font-display); font-size: 14px; }
.tip span { color: var(--muted); }

/* thói quen */
.row3 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 380px); gap: 20px; }
.scroll { overflow-x: auto; }
.hgrid { min-width: 640px; display: flex; flex-direction: column; gap: 8px; }
.hrow { display: grid; grid-template-columns: minmax(130px, 1.2fr) repeat(7, minmax(36px, 1fr)) 50px 76px; gap: 8px; align-items: center; }
.hrow.head { font-size: 12px; color: var(--muted); text-align: center; padding-bottom: 2px; }
.hrow .nm { font-weight: 500; overflow-wrap: anywhere; padding-right: 6px; }
.hrow.head .nm { text-align: left; font-weight: 400; }
.dcol { display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
.dcol.today b { color: var(--b1); }
.dcol small { font-size: 11px; }
.cell { height: 38px; width: 100%; border-radius: 10px; border: 0; background: var(--b3); display: grid; place-items: center; padding: 0; color: var(--on); }
.cell:hover { outline: 2px solid var(--b2); outline-offset: -2px; }
.cell[aria-pressed="true"] { background: var(--b1); }
.cell svg { width: 16px; height: 16px; display: none; }
.cell[aria-pressed="true"] svg { display: block; }
.pct { text-align: center; font-weight: 600; font-size: 14px; }
.stk { text-align: center; font-size: 13px; color: var(--muted); }
.stk b { color: var(--fg); font-size: 15px; font-family: var(--font-display); }
.empty { color: var(--muted); font-size: 13px; margin: 0; }

.drow { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
.dbig { font-family: var(--font-display); font-size: 38px; font-weight: 600; line-height: 1.05; letter-spacing: -0.02em; }
.dbig small { font-size: 16px; color: var(--muted); font-weight: 500; margin-left: 4px; }
.hlist { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; }
.hl .t { display: flex; justify-content: space-between; gap: 10px; font-size: 14px; }
.hl .t span:first-child { overflow-wrap: anywhere; }
.hl .t b { font-variant-numeric: tabular-nums; }
.hl small { color: var(--muted); font-size: 12px; }
.bar { height: 6px; border-radius: 99px; background: var(--b3); overflow: hidden; margin: 5px 0 3px; }
.bar i { display: block; height: 100%; background: var(--b1); border-radius: 99px; }

/* việc cần làm */
.days { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; }
.day { background: var(--band); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.day.today { outline: 2px solid var(--b1); outline-offset: -2px; }
.dh { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.dh b { font-family: var(--font-display); font-weight: 600; font-size: 14px; }
.dh span { color: var(--muted); font-size: 12px; }
.prog { font-size: 12px; color: var(--muted); margin-top: -4px; }
.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; min-height: 28px; }
.task { display: flex; align-items: flex-start; gap: 8px; }
.tk { flex: none; width: 20px; height: 20px; margin-top: 1px; border-radius: 50%; border: 1.5px solid var(--b2); background: transparent; display: grid; place-items: center; padding: 0; color: var(--on); }
.tk:hover { border-color: var(--b1); }
.tk[aria-pressed="true"] { background: var(--b1); border-color: var(--b1); }
.tk svg { width: 12px; height: 12px; display: none; }
.tk[aria-pressed="true"] svg { display: block; }
.tt { flex: 1; min-width: 0; overflow-wrap: anywhere; font-size: 14px; }
.task.done .tt { color: var(--muted); text-decoration: line-through; }
.xbtn { flex: none; background: none; border: 0; color: var(--muted); width: 24px; height: 24px; border-radius: 6px; padding: 0; line-height: 1; font-size: 16px; }
.xbtn:hover { color: var(--neg); }
.addf, .mrow { display: flex; gap: 6px; }
.addf { margin-top: auto; }
.addf input, .mrow input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 9px; padding: 7px 10px; background: var(--surface); font-size: 14px; }
.addf input::placeholder, .mrow input::placeholder { color: var(--muted); }
.btn, .addf button { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 7px 12px; font-weight: 600; font-size: 14px; }
.btn:hover, .addf button:hover { border-color: var(--b1); }
.btn.primary { background: var(--b1); color: var(--on); border-color: var(--b1); }
.btn.danger { color: var(--neg); }

/* danh sách tuần */
.wlist { display: flex; flex-direction: column; }
.wrow { display: grid; grid-template-columns: minmax(130px, 1.2fr) 1fr 1fr; gap: 8px 20px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 8px; border-radius: 0; }
.wrow:first-child { border-top: 0; }
.wrow:hover { background: var(--band); }
.wrow b { font-family: var(--font-display); font-weight: 600; }
.mini small { display: block; font-size: 12px; color: var(--muted); }

/* quản lý, sao lưu */
details.manage summary { cursor: pointer; font-family: var(--font-display); font-weight: 600; font-size: 16px; }
.mlist { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.foot .hint { color: var(--muted); font-size: 13px; flex-basis: 100%; }

/* đăng nhập */
.auth { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 16px; padding: 16px 20px; }
.auth b { font-family: var(--font-display); }
.authline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; font-size: 13px; }

@media (max-width: 900px) {
  .row2, .row3 { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  .wlabel { min-width: 0; font-size: 16px; }
  .status { text-align: left; }
  .knum { font-size: 44px; }
  .wrow { grid-template-columns: 1fr 1fr; }
  .wrow > b { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: no-preference) {
  .bar i { transition: width .25s ease; }
}
</style>
</head>

<script>
(function () {
  "use strict";

  var DAYS_LONG = ["Thứ Hai", "Thứ Ba", "Thứ Tư", "Thứ Năm", "Thứ Sáu", "Thứ Bảy", "Chủ Nhật"];
  var DEFAULT_HABITS = [
    { id: "h_day_som", name: "Dậy sớm đúng 06h00" },
    { id: "h_gym", name: "Tập gym/Thể thao" },
    { id: "h_anh", name: "Học Tiếng Anh" },

  ];
  var LS_KEY = "nhip-tuan-v1";
  /* Dán cấu hình Firebase vào đây (thay cho null). Để null thì trang chỉ lưu trong trình duyệt. */
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyDrezzF7kKKM1L0gwNk3_fYzxXrL5vCUSc",
    authDomain: "plan-e00c1.firebaseapp.com",
    projectId: "plan-e00c1",
    storageBucket: "plan-e00c1.firebasestorage.app",
    messagingSenderId: "354331364714",
    appId: "1:354331364714:web:f45ca63368fb5312f36913"
  };
  var authUser = null, authReady = false, unsubCloud = null;
  var CHECK = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8.5l3.2 3.2L13 4.8"/></svg>';
  var LEFT = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>';
  var RIGHT = '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3l5 5-5 5"/></svg>';

  /* ---------- ngày tháng ---------- */
  function pad(n) { return String(n).padStart(2, "0"); }
  function key(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parse(k) { var p = k.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function addDays(k, n) { var d = parse(k); d.setDate(d.getDate() + n); return key(d); }
  function mondayOf(d) { var x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return key(x); }
  function fmt(k) { var d = parse(k); return pad(d.getDate()) + "/" + pad(d.getMonth() + 1); }
  function todayKey() { return key(new Date()); }
  function dayIndex(k) { return (parse(k).getDay() + 6) % 7; }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function uid() { return Math.random().toString(36).slice(2, 9); }

  /* ---------- dữ liệu ---------- */
  var S = { habits: null, weeks: {} };
  var view = "week";
  var cur = mondayOf(new Date());
  var manageOpen = false;
  var confirmDel = null;
  var focusId = null;
  var statusText = "Đang kết nối nơi lưu dữ liệu…";
  var app = document.getElementById("app");

  function habits() { return S.habits || DEFAULT_HABITS; }
  function emptyWeek() { return { tasks: [[], [], [], [], [], [], []], habits: {} }; }
  function getW(wk) { if (!S.weeks[wk]) S.weeks[wk] = emptyWeek(); return S.weeks[wk]; }
  function normalizeWeek(d) {
    var w = emptyWeek();
    for (var i = 0; i < 7; i++) {
      var a = d && d.tasks && d.tasks["d" + i];
      w.tasks[i] = Array.isArray(a) ? a.filter(function (t) { return t && typeof t.t === "string"; }).map(function (t) { return { id: String(t.id || uid()), t: t.t, d: !!t.d }; }) : [];
    }
    if (d && d.habits && typeof d.habits === "object") {
      Object.keys(d.habits).forEach(function (h) {
        var a = d.habits[h];
        if (Array.isArray(a)) w.habits[h] = [0, 1, 2, 3, 4, 5, 6].map(function (i) { return !!a[i]; });
      });
    }
    return w;
  }
  function weekBody(wk) {
    var W = getW(wk), tasks = {};
    for (var i = 0; i < 7; i++) tasks["d" + i] = W.tasks[i];
    return { week: wk, tasks: tasks, habits: W.habits };
  }
  function cfgBody() { return { habits: habits() }; }

  function weekStats(wk) {
    var W = S.weeks[wk], H = habits(), td = 0, tt = 0, hd = 0, i;
    if (W) {
      for (i = 0; i < 7; i++) W.tasks[i].forEach(function (t) { tt++; if (t.d) td++; });
      H.forEach(function (h) { var a = W.habits[h.id]; if (a) hd += a.filter(Boolean).length; });
    }
    return {
      td: td, tt: tt, hd: hd,
      hp: H.length ? Math.round(hd / (H.length * 7) * 100) : 0,
      tp: tt ? Math.round(td / tt * 100) : 0,
      any: tt > 0 || hd > 0
    };
  }
  function habitDone(hid, k) {
    var W = S.weeks[mondayOf(parse(k))];
    var a = W && W.habits[hid];
    return !!(a && a[dayIndex(k)]);
  }
  function streak(hid) {
    var k = todayKey();
    if (!habitDone(hid, k)) k = addDays(k, -1);
    var n = 0;
    while (habitDone(hid, k)) { n++; k = addDays(k, -1); }
    return n;
  }
  function earliestWeek() {
    var ks = Object.keys(S.weeks).filter(function (k) { return weekStats(k).any; }).sort();
    return ks[0] || null;
  }
  function bestStreak(hid) {
    var start = earliestWeek();
    if (!start) return 0;
    var k = start, end = todayKey(), run = 0, best = 0, guard = 0;
    while (k <= end && guard++ < 4000) {
      if (habitDone(hid, k)) { run++; if (run > best) best = run; } else run = 0;
      k = addDays(k, 1);
    }
    return best;

        var arr = W.habits[hb.id] || [], n = arr.filter(Boolean).length, s = streak(hb.id);
        h += '<div class="hrow"><div class="nm">' + esc(hb.name) + "</div>";
        for (var i = 0; i < 7; i++) h += '<button class="cell" data-act="hab" data-h="' + esc(hb.id) + '" data-i="' + i + '" aria-pressed="' + !!arr[i] + '" aria-label="' + esc(hb.name) + ", " + DAYS_LONG[i] + '">' + CHECK + "</button>";
        h += '<div class="pct tn">' + Math.round(n / 7 * 100) + '%</div><div class="stk tn">' + (s ? "<b>" + s + "</b> ngày" : "–") + "</div></div>";
      });
      h += "</div></div>";
    }
    h += "</div></article>";

    var rates = H.map(function (hb) { return habitRate(hb.id, 30); });
    var avg = rates.length ? Math.round(rates.reduce(function (a, b) { return a + b; }, 0) / rates.length) : 0;
    var d = '<article class="card" id="sec-streak"><div class="ch"><h2>Tỷ lệ 30 ngày qua</h2><span class="sub">Tính đến hôm nay</span></div><div class="cb">';
    if (!H.length) d += '<p class="empty">Chưa có thói quen nào để thống kê.</p>';
    else {
      d += '<div class="drow"><div><div class="dbig tn">' + avg + '<small>%</small></div><div class="muted">trung bình mọi thói quen</div></div>' + donut(avg, 96, 14) + "</div><div class=\"hlist\">";
      H.forEach(function (hb, i) {
        d += '<div class="hl"><div class="t"><span>' + esc(hb.name) + '</span><b>' + rates[i] + '%</b></div><div class="bar"><i style="width:' + rates[i] + '%"></i></div><small class="tn">Chuỗi ' + streak(hb.id) + " ngày · dài nhất " + bestStreak(hb.id) + " ngày</small></div>";
      });
      d += "</div>";
    }
    d += "</div></article>";
    return '<div class="row3">' + h + d + "</div>";
  }
  function tasksSec() {
    var W = getW(cur), today = todayKey();
    var h = '<article class="card" id="sec-tasks"><div class="ch"><h2>Việc cần làm</h2><span class="sub">Tích vào vòng tròn khi xong việc</span></div><div class="cb"><div class="days">';
    [0, 1, 2, 3, 4, 5, 6].forEach(function (i) {
      var k = addDays(cur, i), list = W.tasks[i], dn = list.filter(function (t) { return t.d; }).length, pc = list.length ? Math.round(dn / list.length * 100) : 0;
      h += '<div class="day' + (k === today ? " today" : "") + '"><div class="dh"><b>' + DAYS_LONG[i] + '</b><span class="tn">' + fmt(k) + "</span></div>" +
        '<div class="bar" aria-hidden="true"><i style="width:' + pc + '%"></i></div><div class="prog tn">' + dn + "/" + list.length + " việc xong</div><ul class=\"tasks\">";
      if (!list.length) h += '<li class="empty">Chưa có việc</li>';
      list.forEach(function (t) {
        h += '<li class="task' + (t.d ? " done" : "") + '"><button class="tk" data-act="tk" data-d="' + i + '" data-id="' + esc(t.id) + '" aria-pressed="' + t.d + '" aria-label="Đánh dấu hoàn thành">' + CHECK + '</button><span class="tt">' + esc(t.t) +
          '</span><button class="xbtn" data-act="del" data-d="' + i + '" data-id="' + esc(t.id) + '" aria-label="Xóa việc">×</button></li>';
      });
      h += '</ul><form class="addf" data-form="task" data-d="' + i + '"><input id="add-d' + i + '" type="text" maxlength="200" placeholder="Thêm việc" aria-label="Thêm việc cho ' + DAYS_LONG[i] + '" autocomplete="off"><button type="submit">Thêm</button></form></div>';
    });
    return h + "</div></div></article>";
  }
  function weeksSec() {
    var thisMon = mondayOf(new Date());
    var all = Object.keys(S.weeks).filter(function (k) { return weekStats(k).any; });
    if (all.indexOf(thisMon) < 0) all.push(thisMon);
    all.sort().reverse();
    var h = '<article class="card" id="sec-weeks"><div class="ch"><h2>Tất cả các tuần</h2><span class="sub">Bấm vào một tuần để xem và sửa lại</span></div><div class="cb"><div class="wlist">';
    all.forEach(function (wk) {
      var st = weekStats(wk), e = addDays(wk, 6);
      h += '<button class="wrow" data-act="open" data-wk="' + wk + '"><b class="tn">' + fmt(wk) + " – " + fmt(e) + "/" + parse(e).getFullYear() + (wk === thisMon ? " · tuần này" : "") + "</b>" +
        '<div class="mini"><small class="tn">Việc ' + st.td + "/" + st.tt + '</small><div class="bar"><i style="width:' + st.tp + '%"></i></div></div>' +
        '<div class="mini"><small class="tn">Thói quen ' + st.hp + '%</small><div class="bar"><i style="width:' + st.hp + '%"></i></div></div></button>';
    });
    return h + "</div></div></article>";
  }
  function manageSec() {
    var H = habits();
    var h = '<article class="card" id="sec-manage"><div class="cb"><details class="manage"' + (manageOpen ? " open" : "") + '><summary>Quản lý thói quen</summary><div class="mlist">';
    H.forEach(function (hb) {
      var ask = confirmDel === hb.id;
      h += '<div class="mrow"><input type="text" maxlength="80" value="' + esc(hb.name) + '" data-act="hname" data-h="' + esc(hb.id) + '" aria-label="Tên thói quen"><button class="btn danger" data-act="hdel" data-h="' + esc(hb.id) + '">' + (ask ? "Xác nhận xóa" : "Xóa") + "</button></div>";
    });
    h += '<form class="mrow" data-form="habit"><input id="add-habit" type="text" maxlength="80" placeholder="Thói quen mới" aria-label="Tên thói quen mới" autocomplete="off"><button class="btn primary" type="submit">Thêm</button></form>';
    h += '<p class="empty">Xóa một thói quen chỉ ẩn nó khỏi danh sách. Lịch sử tick của các tuần cũ vẫn được giữ.</p></div></details></div></article>';
    return h;
  }
  function foot() {
    return '<article class="card"><div class="cb foot"><button class="btn" data-act="export">Sao lưu ra file</button><button class="btn" data-act="import">Khôi phục từ file</button>' +
      '<input type="file" id="import-file" accept="application/json,.json" hidden><span class="hint">File sao lưu chứa toàn bộ các tuần, thói quen và việc cần làm của bạn.</span></div></article>';
  }

  function render() {
    app.innerHTML = head() + authBar() + weekbar() + kpis() + row2() + row3() + tasksSec() + weeksSec() + manageSec() + foot();
    if (focusId) { var el = document.getElementById(focusId); if (el) el.focus(); focusId = null; }
  }

  /* ---------- thao tác ---------- */
  function touchWeek(wk) { queue("w_" + wk); }
  app.addEventListener("click", function (e) {
    var t = e.target.closest("[data-act]");
    if (!t || t.tagName === "INPUT") return;
    var act = t.getAttribute("data-act");
    if (act !== "hdel") confirmDel = null;
    var W, hid, i, d;
    switch (act) {
      case "login": login(); break;
      case "logout": logout(); break;
      case "prev": cur = addDays(cur, -7); render(); break;
      case "next": cur = addDays(cur, 7); render(); break;
      case "today": cur = mondayOf(new Date()); render(); break;
      case "open": cur = t.getAttribute("data-wk"); render(); window.scrollTo(0, 0); break;
      case "goto":
        var el = document.getElementById(t.getAttribute("data-t"));
        if (el) el.scrollIntoView({ behavior: window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block: "start" });
        break;
      case "hab":
        hid = t.getAttribute("data-h"); i = +t.getAttribute("data-i"); W = getW(cur);
        if (!W.habits[hid]) W.habits[hid] = [false, false, false, false, false, false, false];
        W.habits[hid][i] = !W.habits[hid][i];
        touchWeek(cur); render(); break;
      case "tk":
        d = +t.getAttribute("data-d"); W = getW(cur);
        W.tasks[d].forEach(function (x) { if (x.id === t.getAttribute("data-id")) x.d = !x.d; });
        touchWeek(cur); render(); break;
      case "del":
        d = +t.getAttribute("data-d"); W = getW(cur);
        W.tasks[d] = W.tasks[d].filter(function (x) { return x.id !== t.getAttribute("data-id"); });
        touchWeek(cur); render(); break;
      case "hdel":
        hid = t.getAttribute("data-h");
        if (confirmDel === hid) {
          S.habits = habits().filter(function (x) { return x.id !== hid; });
          confirmDel = null; queue("config");
        } else confirmDel = hid;
        render(); break;
      case "export": doExport(); break;
      case "import": document.getElementById("import-file").click(); break;
    }
  });
  app.addEventListener("submit", function (e) {
    var f = e.target.closest("form");
    if (!f) return;
    e.preventDefault();
    var input = f.querySelector("input"), v = input.value.trim();
    if (!v) return;
    if (f.getAttribute("data-form") === "task") {
      var d = +f.getAttribute("data-d");
      getW(cur).tasks[d].push({ id: uid(), t: v, d: false });
      touchWeek(cur); focusId = "add-d" + d; render();
    } else {
      S.habits = habits().concat([{ id: "h_" + uid(), name: v }]);
      queue("config"); focusId = "add-habit"; render();
    }
  });
  app.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "import-file") { doImport(t); return; }
    if (t.id === "range") { range = +t.value === 12 ? 12 : 8; render(); return; }
    if (t.getAttribute && t.getAttribute("data-act") === "hname") {
      var hid = t.getAttribute("data-h"), v = t.value.trim();
      if (!v) { render(); return; }
      S.habits = habits().map(function (x) { return x.id === hid ? { id: x.id, name: v } : x; });
      queue("config"); render();
    }
  });
  app.addEventListener("toggle", function (e) {
    if (e.target && e.target.classList && e.target.classList.contains("manage")) manageOpen = e.target.open;
  }, true);
  app.addEventListener("mousemove", function (e) {
    var el = document.getElementById("tip");
    if (!el) return;
    var h = e.target.closest ? e.target.closest(".hit") : null;
    if (!h) { el.hidden = true; return; }
    var p = h.getAttribute("data-tip").split("|"), box = el.parentNode.getBoundingClientRect();
    el.innerHTML = "<b>" + esc(p[0]) + "</b><span>" + esc(p[1]) + "</span><span>" + esc(p[2]) + "</span>";
    el.hidden = false;
    var x = e.clientX - box.left + 14, y = e.clientY - box.top - 8;
    el.style.left = Math.max(4, Math.min(x, box.width - el.offsetWidth - 4)) + "px";
    el.style.top = Math.max(0, y) + "px";
  });
  app.addEventListener("mouseleave", function () { var el = document.getElementById("tip"); if (el) el.hidden = true; });

  function doExport() {
    var data = JSON.stringify({ v: 1, habits: habits(), weeks: S.weeks }, null, 2);
    var name = "ke-hoach-tuan-sao-luu-" + todayKey() + ".json";
    var c = window.claude;
    if (!c || !c.use) {
      try {
        var url = URL.createObjectURL(new Blob([data], { type: "application/json" }));
        var a = document.createElement("a");
        a.href = url; a.download = name;
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
        setStatus("Đã tạo file sao lưu.");
      } catch (err) { setStatus("Không tạo được file sao lưu."); }
      return;
    }
    c.use("downloads").then(function (dl) {
      if (!dl) { setStatus("Không tải được file ở chế độ xem này. Hãy mở trang trong Claude."); return; }
      return dl.save({ filename: name, data: data }).then(function () { setStatus("Đã tạo file sao lưu."); });
    }).catch(function (err) {
      if (err && err.code === "declined") return;
      setStatus("Không tạo được file sao lưu.");
    });
  }
  function doImport(input) {
    var f = input.files && input.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        var o = JSON.parse(String(r.result));
        if (!o || typeof o.weeks !== "object") throw new Error("bad");
        if (Array.isArray(o.habits)) { S.habits = o.habits.filter(function (h) { return h && h.id && typeof h.name === "string"; }); queue("config"); }
        Object.keys(o.weeks).forEach(function (wk) {
          var src = o.weeks[wk] || {};
          S.weeks[wk] = normalizeWeek({ tasks: tasksToObj(src.tasks), habits: src.habits });
          touchWeek(wk);
        });
        setStatus("Đã khôi phục " + Object.keys(o.weeks).length + " tuần từ file.");
        render();
      } catch (err) { setStatus("File không đúng định dạng sao lưu của Kế hoạch tuần."); }
    };
    r.readAsText(f);
    input.value = "";
  }

  init();
})();
</script>

</body>
</html>
